<!--
  WordPress skin favicon: a circled "R" in the shape of the WordPress mark, but
  in the site's own Kubrick blue. Gradient mirrors .wp-header in
  app/globals.css (#467298 -> #2e5d8c -> #29537d). The R is an outlined Georgia
  Bold glyph (the skin's heading face) so the mark needs no font loading.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="wp-disc" x1="32" y1="1" x2="32" y2="63" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c7aa0" />
      <stop offset="0.7" stop-color="#2e5d8c" />
      <stop offset="1" stop-color="#29537d" />
    </linearGradient>
  </defs>

  <!-- darker ring keeps the disc legible against white browser chrome -->
  <circle cx="32" cy="32" r="31.2" fill="url(#wp-disc)" stroke="#1f4468" stroke-width="1.6" />

  <!-- Georgia Bold "R", cap height 34, baseline y=49 -->
  <g transform="translate(10.83 49) scale(0.34)" fill="#f5f5f3">
    <path
