<!--
  WordPress skin favicon: a circled "R" in the shape of the WordPress mark, in
  the site's own Kubrick blue (#2e5d8c) on parchment (#f5f5f3) — see .wp in
  app/globals.css. The R is an outlined Georgia Bold glyph (the skin's heading
  face) so the mark needs no font loading — favicon SVGs render in a restricted
  context with no webfonts.

  Regenerate the derived assets after editing: bun run scripts/build-favicons.ts
-->
