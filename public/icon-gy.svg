<!--
  Graveyard skin favicon: a lit candle on the night sky — the vigil kept for a
  dormant blog. Colors track app/globals.css (.gy): night #0b1120, wax from the
  parchment ramp #b9b096/#efe9d4, flame #fff3cf -> #ffc45e -> #f08b2e (the same
  radial the hero candles use).

  Regenerate the derived assets after editing: bun run scripts/build-favicons.ts
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gy-wax" x1="26" y1="0" x2="38" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9b096" />
      <stop offset="0.45" stop-color="#efe9d4" />
      <stop offset="1" stop-color="#b9b096" />
    </linearGradient>
    <radialGradient id="gy-flame" cx="32" cy="27" r="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3cf" />
      <stop offset="0.5" stop-color="#ffc45e" />
      <stop offset="1" stop-color="#f08b2e" />
    </radialGradient>
    <!-- falls off to fully transparent; a flat-opacity circle reads as a
         hard-edged brown disc once rasterized down to 16px -->
    <radialGradient id="gy-glow" cx="32" cy="26" r="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc45e" stop-opacity="0.3" />
      <stop offset="0.55" stop-color="#ffc45e" stop-opacity="0.12" />
      <stop offset="1" stop-color="#ffc45e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="10" fill="#0b1120" />

  <circle cx="32" cy="26" r="21" fill="url(#gy-glow)" />

  <rect x="25" y="34" width="14" height="30" rx="3" fill="url(#gy-wax)" />

  <path d="M32 8c7 9 10 12 10 18a10 10 0 0 1-20 0c0-6 3-9 10-18Z" fill="url(#gy-flame)" />
</svg>
